name: Infrastructure Setup (Permanent)

on:
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a
  VM_USER: ubuntu
  INSTANCE_NAME: defectdojo-vm1

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Restore Terraform state
        run: |
          mkdir -p infrastructure/gcp
          gh api repos/${{ github.repository }}/contents/terraform.tfstate \
            --jq '.content' | base64 -d > infrastructure/gcp/terraform.tfstate 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Init & Apply
        working-directory: infrastructure/gcp
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="zone=${{ env.GCP_ZONE }}" \
            -var="machine_type=e2-micro"
          echo "INSTANCE_IP=$(terraform output -raw instance_ip)"     >> $GITHUB_ENV
          echo "INSTANCE_NAME=$(terraform output -raw instance_name)" >> $GITHUB_ENV

      - name: Save Terraform state
        if: always()
        run: |
          gh api repos/${{ github.repository }}/contents/terraform.tfstate \
            -X PUT \
            --field message="Update terraform state" \
            --field content="$(base64 -w0 infrastructure/gcp/terraform.tfstate)" \
            --field sha="$(gh api repos/${{ github.repository }}/contents/terraform.tfstate --jq '.sha' 2>/dev/null || echo '')" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate temporary SSH key
        run: |
          ssh-keygen -t ed25519 -f ~/.ssh/deploy_key -N "" -C "github-actions-temp"
          chmod 600 ~/.ssh/deploy_key
          echo "SSH key generated"

      - name: Push SSH public key to VM via gcloud
        run: |
          echo "Waiting for VM to be ready..."
          for i in $(seq 1 12); do
            STATUS=$(gcloud compute instances describe ${{ env.INSTANCE_NAME }} \
              --zone=${{ env.GCP_ZONE }} \
              --format="value(status)" 2>/dev/null || echo "UNKNOWN")
            echo "  VM status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "VM is running"
              break
            fi
            sleep 10
          done

          gcloud compute instances add-metadata ${{ env.INSTANCE_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --metadata="ssh-keys=${{ env.VM_USER }}:$(cat ~/.ssh/deploy_key.pub)"

          echo "SSH public key pushed to VM"

      - name: Wait for SSH to be ready
        run: |
          echo "Waiting for SSH service to start..."
          sleep 20

          for i in $(seq 1 20); do
            if ssh -i ~/.ssh/deploy_key \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=10 \
                ${{ env.VM_USER }}@${{ env.INSTANCE_IP }} \
                "echo 'SSH Ready'" 2>/dev/null; then
              echo "✓ SSH is ready"
              exit 0
            fi
            echo "  Attempt $i/20 - retrying in 10s..."
            sleep 10
          done
          
          echo "✗ SSH failed to become ready"
          exit 1

      - name: Copy Ansible files to VM
        run: |
          cd "${GITHUB_WORKSPACE}"
          
          # Verify ansible directory exists
          if [ ! -d "ansible" ]; then
            echo "ERROR: ansible directory not found!"
            ls -la
            exit 1
          fi
          
          tar -czf ansible.tar.gz ansible/
          
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ansible.tar.gz \
            ${{ env.VM_USER }}@${{ env.INSTANCE_IP }}:~/ansible.tar.gz
          
          echo "✓ Ansible files copied"

      - name: Run Ansible playbook on VM
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${{ env.VM_USER }}@${{ env.INSTANCE_IP }} bash << 'ENDSSH'
            set -e
            
            echo "=========================================="
            echo "Setting up DefectDojo on VM"
            echo "=========================================="
            
            # Wait for cloud-init to complete
            echo "⏳ Waiting for cloud-init..."
            sudo cloud-init status --wait 2>/dev/null || true
            
            # Wait for system to stabilize
            echo "⏳ Waiting for system to stabilize..."
            sleep 30
            
            # Stop unattended upgrades to avoid lock conflicts
            echo "🛑 Stopping unattended-upgrades..."
            sudo systemctl stop unattended-upgrades 2>/dev/null || true
            sudo killall -9 unattended-upgrade apt-get apt 2>/dev/null || true
            sleep 5
            
            # Enable universe repository
            echo "📦 Enabling universe repository..."
            sudo add-apt-repository universe -y
            
            # Update package lists with retry
            echo "🔄 Updating package lists..."
            for i in {1..5}; do
              if sudo apt-get update; then
                echo "✓ Package lists updated"
                break
              fi
              echo "  Retry $i/5 in 10s..."
              sleep 10
            done
            
            # Install dependencies
            echo "📥 Installing Ansible..."
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              software-properties-common \
              ansible
            
            echo "📥 Installing Docker..."
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io
            sudo systemctl enable docker
            sudo systemctl start docker
            
            echo "📥 Installing Docker Compose..."
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              docker-compose-plugin 2>/dev/null || \
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker-compose
            
            # Verify installations
            echo "✓ Ansible version: $(ansible --version | head -n1)"
            echo "✓ Docker version: $(docker --version)"
            echo "✓ Docker Compose version: $(docker compose version 2>/dev/null || docker-compose version)"
            
            # Extract and run Ansible playbook
            echo "📂 Extracting Ansible files..."
            tar -xzf ~/ansible.tar.gz
            
            echo "🚀 Running Ansible playbook..."
            cd ~/ansible
            sudo ansible-playbook -i localhost, -c local site.yml \
              -e "db_password=${{ secrets.DB_PASSWORD }}" \
              -e "dd_admin_password=${{ secrets.DD_ADMIN_PASSWORD }}" \
              -e "dd_secret_key=${{ secrets.DD_SECRET_KEY }}"
            
            echo "=========================================="
            echo "✓ Ansible playbook completed successfully"
            echo "=========================================="
          ENDSSH

      - name: Verify DefectDojo is accessible
        run: |
          echo "Waiting for DefectDojo to start..."
          sleep 45

          for i in $(seq 1 15); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${{ env.INSTANCE_IP }}:8080/login?next=/" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ DefectDojo is accessible - HTTP $HTTP_CODE"
              exit 0
            else
              echo "  Attempt $i/15 - HTTP $HTTP_CODE - retrying in 15s..."
              sleep 15
            fi
          done
          
          echo "⚠️  DefectDojo not accessible after 15 attempts"
          echo "This may be normal if the application takes longer to start"
          echo "Check manually at: http://${{ env.INSTANCE_IP }}:8080"

      - name: Remove temporary SSH key from VM
        if: always()
        run: |
          gcloud compute instances remove-metadata ${{ env.INSTANCE_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --keys=ssh-keys 2>/dev/null || true

      - name: Print deployment summary
        if: success()
        run: |
          echo ""
          echo "=============================================="
          echo "  ✓ DefectDojo Deployment Complete!"
          echo "=============================================="
          echo ""
          echo "  🌐 URL:      http://${{ env.INSTANCE_IP }}:8080"
          echo "  👤 Username: admin"
          echo "  🔑 Password: (Use DD_ADMIN_PASSWORD secret)"
          echo ""
          echo "  🔌 SSH:      ssh ubuntu@${{ env.INSTANCE_IP }}"
          echo ""
          echo "=============================================="
          echo ""

      - name: Debug information on failure
        if: failure()
        run: |
          echo ""
          echo "=========================================="
          echo "⚠️  Deployment Failed - Debug Info"
          echo "=========================================="
          echo ""
          echo "Instance: ${{ env.INSTANCE_NAME }}"
          echo "IP: ${{ env.INSTANCE_IP }}"
          echo "Zone: ${{ env.GCP_ZONE }}"
          echo ""
          echo "Try manual SSH:"
          echo "  gcloud compute ssh ${{ env.INSTANCE_NAME }} --zone=${{ env.GCP_ZONE }}"
          echo ""
          echo "Check logs:"
          echo "  gcloud compute instances get-serial-port-output ${{ env.INSTANCE_NAME }} --zone=${{ env.GCP_ZONE }}"
          echo ""
          echo "=========================================="