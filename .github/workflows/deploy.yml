name: Infrastructure Setup (Permanent)

on:
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a
  VM_USER: ubuntu
  # Fallback in case Terraform output fails
  INSTANCE_NAME: defectdojo-vm

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Auth ────────────────────────────────────────────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # ── Terraform ───────────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Terraform Init & Apply
         working-directory: infrastructure/gcp
        run: |
          terraform init

          # Import existing resources if they already exist
          terraform import google_compute_network.defectdojo_vpc \
            projects/${{ secrets.GCP_PROJECT_ID }}/global/networks/defectdojo-vpc 2>/dev/null || true

          terraform import google_compute_address.defectdojo_ip \
            projects/${{ secrets.GCP_PROJECT_ID }}/regions/us-central1/addresses/defectdojo-static-ip 2>/dev/null || true

          terraform import google_compute_subnetwork.defectdojo_subnet \
            projects/${{ secrets.GCP_PROJECT_ID }}/regions/us-central1/subnetworks/defectdojo-subnet 2>/dev/null || true

          terraform import google_compute_firewall.allow_ssh \
            projects/${{ secrets.GCP_PROJECT_ID }}/global/firewalls/defectdojo-allow-ssh 2>/dev/null || true

          terraform import google_compute_firewall.allow_http \
            projects/${{ secrets.GCP_PROJECT_ID }}/global/firewalls/defectdojo-allow-http 2>/dev/null || true

          terraform import google_compute_firewall.allow_internal \
            projects/${{ secrets.GCP_PROJECT_ID }}/global/firewalls/defectdojo-allow-internal 2>/dev/null || true

          terraform apply -auto-approve \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="zone=${{ env.GCP_ZONE }}" \
            -var="machine_type=e2-standard-2"

          echo "INSTANCE_IP=$(terraform output -raw instance_ip)"     >> $GITHUB_ENV
          echo "INSTANCE_NAME=$(terraform output -raw instance_name)" >> $GITHUB_ENV

      # ── SSH Key (temp, generated fresh every run) ───────────────────────────
      - name: Generate temporary SSH key
        run: |
          ssh-keygen -t ed25519 -f ~/.ssh/deploy_key -N "" -C "github-actions-temp"
          echo "SSH key generated"

      - name: Push SSH public key to VM via gcloud
        run: |
          echo "Waiting for VM to be ready..."
          for i in $(seq 1 12); do
            STATUS=$(gcloud compute instances describe ${{ env.INSTANCE_NAME }} \
              --zone=${{ env.GCP_ZONE }} \
              --format="value(status)")
            echo "  VM status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "VM is running"
              break
            fi
            sleep 10
          done

          gcloud compute instances add-metadata ${{ env.INSTANCE_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --metadata="ssh-keys=${{ env.VM_USER }}:$(cat ~/.ssh/deploy_key.pub)"

          echo "SSH public key pushed to VM"

      - name: Test SSH connection
        run: |
          echo "Waiting for SSH to be available..."
          sleep 15

          for i in $(seq 1 10); do
            if ssh -i ~/.ssh/deploy_key \
                -o StrictHostKeyChecking=no \
                -o ConnectTimeout=10 \
                ${{ env.VM_USER }}@${{ env.INSTANCE_IP }} \
                "echo SSH connection successful"; then
              echo "SSH is ready"
              break
            else
              echo "  Attempt $i/10 - retrying in 10s..."
              sleep 10
            fi
          done

      # ── Ansible ─────────────────────────────────────────────────────────────
      - name: Copy Ansible files to VM
        run: |
          tar -czf ansible.tar.gz ansible/

          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ansible.tar.gz \
            ${{ env.VM_USER }}@${{ env.INSTANCE_IP }}:~/ansible.tar.gz

          echo "Ansible files copied"

      - name: Run Ansible playbook on VM
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ env.VM_USER }}@${{ env.INSTANCE_IP }} bash << 'ENDSSH'
              set -e

              echo "Installing dependencies..."
              sudo apt-get update -qq
              sudo apt-get install -y ansible docker.io docker-compose-v2

              echo "Extracting Ansible files..."
              tar -xzf ~/ansible.tar.gz

              echo "Running Ansible playbook..."
              cd ~/ansible
              sudo ansible-playbook -i localhost, -c local site.yml \
                -e "db_password=${{ secrets.DB_PASSWORD }}" \
                -e "dd_admin_password=${{ secrets.DD_ADMIN_PASSWORD }}" \
                -e "dd_secret_key=${{ secrets.DD_SECRET_KEY }}"

              echo "Ansible completed"
          ENDSSH

      # ── Verify ──────────────────────────────────────────────────────────────
      - name: Verify DefectDojo is accessible
        run: |
          echo "Waiting for DefectDojo to start..."
          sleep 30

          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${{ env.INSTANCE_IP }}:8080/login?next=/" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "DefectDojo is accessible - HTTP $HTTP_CODE"
              break
            else
              echo "  Attempt $i/12 - HTTP $HTTP_CODE - retrying in 15s..."
              sleep 15
            fi
          done

      # ── Cleanup ─────────────────────────────────────────────────────────────
      - name: Remove temporary SSH key from VM
        if: always()
        run: |
          if [ -n "${{ env.INSTANCE_NAME }}" ]; then
            gcloud compute instances remove-metadata ${{ env.INSTANCE_NAME }} \
              --zone=${{ env.GCP_ZONE }} \
              --keys="ssh-keys" || echo "Could not remove SSH key metadata"
            echo "Temporary SSH key removed from VM"
          else
            echo "INSTANCE_NAME not set, skipping cleanup"
          fi

      # ── Summary ─────────────────────────────────────────────────────────────
      - name: Print deployment summary
        if: success()
        run: |
          echo "=============================================="
          echo "  DefectDojo Deployment Complete!"
          echo "=============================================="
          echo "  URL:      http://${{ env.INSTANCE_IP }}:8080"
          echo "  Username: admin"
          echo "  Password: (DD_ADMIN_PASSWORD secret)"
          echo "  SSH:      ssh ubuntu@${{ env.INSTANCE_IP }}"
          echo "=============================================="