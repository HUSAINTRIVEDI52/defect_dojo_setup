name: Infrastructure Setup (Permanent)

on:
  workflow_dispatch:
    push:
    branches:
      - Infra-Pipeline

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a
  VM_USER: ubuntu
  INSTANCE_NAME: defectdojo-vm

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Restore Terraform state
        run: |
          mkdir -p infrastructure/gcp
          gh api repos/${{ github.repository }}/contents/terraform.tfstate \
            --jq '.content' | base64 -d > infrastructure/gcp/terraform.tfstate 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Init & Apply
        working-directory: infrastructure/gcp
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="zone=${{ env.GCP_ZONE }}" \
            -var="machine_type=e2-standard-2"
          echo "INSTANCE_IP=$(terraform output -raw instance_ip)"     >> $GITHUB_ENV
          echo "INSTANCE_NAME=$(terraform output -raw instance_name)" >> $GITHUB_ENV

      - name: Save Terraform state
        if: always()
        run: |
          gh api repos/${{ github.repository }}/contents/terraform.tfstate \
            -X PUT \
            --field message="Update terraform state" \
            --field content="$(base64 -w0 infrastructure/gcp/terraform.tfstate)" \
            --field sha="$(gh api repos/${{ github.repository }}/contents/terraform.tfstate --jq '.sha' 2>/dev/null || echo '')" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate temporary SSH key
        run: |
          ssh-keygen -t ed25519 -f ~/.ssh/deploy_key -N "" -C "github-actions-temp"
          chmod 600 ~/.ssh/deploy_key

      - name: Push SSH public key to VM via gcloud
        run: |
          echo "Waiting for VM to be RUNNING..."
          for i in $(seq 1 24); do
            STATUS=$(gcloud compute instances describe ${{ env.INSTANCE_NAME }} \
              --zone=${{ env.GCP_ZONE }} \
              --format="value(status)" 2>/dev/null || echo "UNKNOWN")
            echo "  VM status: $STATUS (attempt $i/24)"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "VM is RUNNING"
              break
            fi
            if [ $i -eq 24 ]; then
              echo "VM never reached RUNNING state after 4 minutes"
              exit 1
            fi
            sleep 10
          done
          gcloud compute instances add-metadata ${{ env.INSTANCE_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --metadata="ssh-keys=${{ env.VM_USER }}:$(cat ~/.ssh/deploy_key.pub)"
          echo "SSH key pushed to VM"

      - name: Wait for SSH to be ready
        run: |
          sleep 20
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/deploy_key \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=10 \
                ${{ env.VM_USER }}@${{ env.INSTANCE_IP }} \
                "echo SSH_READY" 2>/dev/null | grep -q "SSH_READY"; then
              echo "SSH is ready"
              exit 0
            fi
            echo "  Attempt $i/30 - retrying in 10s..."
            sleep 10
          done
          echo "SSH failed to become ready after 5 minutes"
          exit 1

      - name: Copy Ansible files to VM
        run: |
          cd "${GITHUB_WORKSPACE}"
          if [ ! -d "ansible" ]; then
            echo "ERROR: ansible directory not found in workspace"
            ls -la
            exit 1
          fi
          tar -czf ansible.tar.gz ansible/
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ansible.tar.gz \
            ${{ env.VM_USER }}@${{ env.INSTANCE_IP }}:~/ansible.tar.gz
          echo "Ansible files copied to VM"

      - name: Bootstrap VM — install Docker CE + Ansible
        # This runs BEFORE Ansible so Docker is installed the right way
        # (from Docker's official repo, not docker.io) before Ansible touches it.
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            ${{ env.VM_USER }}@${{ env.INSTANCE_IP }} bash << 'BOOTSTRAP'
            set -e

            echo "========== VM Bootstrap =========="

            # Wait for cloud-init to finish
            echo "Waiting for cloud-init..."
            sudo cloud-init status --wait 2>/dev/null || true
            sleep 15

            # Kill apt/dpkg locks
            echo "Clearing package locks..."
            sudo systemctl stop unattended-upgrades 2>/dev/null || true
            sudo systemctl disable unattended-upgrades 2>/dev/null || true
            sudo killall -9 unattended-upgrade apt-get apt dpkg 2>/dev/null || true
            sleep 5
            sudo rm -f /var/lib/dpkg/lock-frontend \
                       /var/lib/dpkg/lock \
                       /var/cache/apt/archives/lock \
                       /var/lib/apt/lists/lock
            sudo dpkg --configure -a 2>/dev/null || true

            # Update apt
            echo "Updating apt..."
            for i in $(seq 1 5); do
              sudo apt-get update -qq && break
              echo "  apt-get update retry $i/5..."
              sleep 15
            done

            # Install prerequisites
            echo "Installing prerequisites..."
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              ca-certificates curl gnupg lsb-release \
              software-properties-common ansible python3-pip git

            # Remove old docker packages
            echo "Removing old docker packages..."
            sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y \
              docker.io docker-compose containerd 2>/dev/null || true

            # Add Docker's official GPG key + repo
            echo "Adding Docker official repo..."
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
              | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            sudo chmod a+r /etc/apt/keyrings/docker.gpg

            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
              https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
              | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

            sudo apt-get update -qq

            # Install Docker CE + Compose plugin
            echo "Installing Docker CE..."
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              docker-ce docker-ce-cli containerd.io \
              docker-buildx-plugin docker-compose-plugin

            sudo systemctl enable docker
            sudo systemctl start docker

            # Wait for Docker daemon
            echo "Waiting for Docker daemon..."
            for i in $(seq 1 20); do
              if sudo docker info > /dev/null 2>&1; then
                echo "Docker is ready"
                break
              fi
              echo "  attempt $i/20..."
              sleep 5
            done

            # Add 4GB swap as safety net
            if [ ! -f /swapfile ]; then
              echo "Adding 4GB swap..."
              sudo fallocate -l 4G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi

            echo ""
            echo "--- Installed versions ---"
            ansible --version | head -n1
            sudo docker --version
            sudo docker compose version
            free -h
            echo "--------------------------"
            echo "Bootstrap complete"
          BOOTSTRAP

      - name: Run Ansible playbook on VM
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            ${{ env.VM_USER }}@${{ env.INSTANCE_IP }} bash << 'ENDSSH'
            set -e

            echo "========== Running Ansible Playbook =========="

            tar -xzf ~/ansible.tar.gz
            cd ~/ansible

            sudo ansible-playbook -i localhost, -c local site.yml \
              -e "db_password=${{ secrets.DB_PASSWORD }}" \
              -e "dd_admin_password=${{ secrets.DD_ADMIN_PASSWORD }}" \
              -e "dd_secret_key=${{ secrets.DD_SECRET_KEY }}" \
              -v

            echo "========== Ansible complete =========="
          ENDSSH

      - name: Collect container logs on failure
        if: failure()
        run: |
          echo "Collecting debug info from VM..."
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${{ env.VM_USER }}@${{ env.INSTANCE_IP }} bash << 'DEBUGSSH' || true

            echo "=== docker compose ps ==="
            cd /opt/defectdojo 2>/dev/null \
              && sudo docker compose ps \
              || echo "No compose state found — DefectDojo dir does not exist"

            echo ""
            echo "=== initializer logs ==="
            sudo docker logs defectdojo-initializer-1 2>&1 | tail -150 \
              || echo "No initializer container found"

            echo ""
            echo "=== postgres logs ==="
            sudo docker logs defectdojo-postgres-1 2>&1 | tail -50 \
              || echo "No postgres container found"

            echo ""
            echo "=== system memory ==="
            free -h

            echo ""
            echo "=== docker version ==="
            sudo docker --version
            sudo docker compose version 2>/dev/null || echo "docker compose plugin NOT found"

            echo ""
            echo "=== disk usage ==="
            df -h /
          DEBUGSSH

      - name: Verify DefectDojo is accessible
        run: |
          echo "Waiting for DefectDojo to come up..."
          sleep 30
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              "http://${{ env.INSTANCE_IP }}:8080/login?next=/" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "DefectDojo is accessible — HTTP $HTTP_CODE"
              exit 0
            fi
            echo "  Attempt $i/20 — HTTP $HTTP_CODE — retrying in 15s..."
            sleep 15
          done
          # Not a hard failure — app may need a bit more time
          echo "DefectDojo not reachable yet — check http://${{ env.INSTANCE_IP }}:8080 manually"
          exit 0

      - name: Remove temporary SSH key from VM
        if: always()
        run: |
          gcloud compute instances remove-metadata ${{ env.INSTANCE_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --keys=ssh-keys 2>/dev/null || true

      - name: Print deployment summary
        if: success()
        run: |
          echo ""
          echo "=============================================="
          echo "  DefectDojo Deployment Complete!"
          echo "=============================================="
          echo "  URL:      http://${{ env.INSTANCE_IP }}:8080"
          echo "  Username: admin"
          echo "  Password: (DD_ADMIN_PASSWORD secret)"
          echo "  SSH:      ssh ubuntu@${{ env.INSTANCE_IP }}"
          echo "=============================================="

      - name: Debug information on failure
        if: failure()
        run: |
          echo ""
          echo "=========================================="
          echo "Deployment Failed — Debug Info"
          echo "=========================================="
          echo "  Instance: ${{ env.INSTANCE_NAME }}"
          echo "  IP:       ${{ env.INSTANCE_IP }}"
          echo "  Zone:     ${{ env.GCP_ZONE }}"
          echo ""
          echo "  SSH in:   gcloud compute ssh ${{ env.INSTANCE_NAME }} --zone=${{ env.GCP_ZONE }}"
          echo "  Logs:     cd /opt/defectdojo && sudo docker compose logs initializer"
          echo "=========================================="