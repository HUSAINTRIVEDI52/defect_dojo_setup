---
- name: Install DefectDojo
  hosts: localhost
  connection: local
  become: true

  vars:
    # Safe internal variable — avoids Ansible self-reference recursion bug
    _dd_admin_password: "{{ dd_admin_password | default('Admin1234!') }}"
    _dd_secret_key: "{{ dd_secret_key | default('hhZCp@D28z!n@NED*yB!ROMt+WzsY*Vy') }}"
    defectdojo_dir: /opt/defectdojo

  tasks:

    - name: Show password prefix (debug, non-sensitive)
      debug:
        msg: "Admin password starts with: {{ _dd_admin_password[:3] }}*** length={{ _dd_admin_password | length }}"

    # =========================================================================
    # 1. BASE PACKAGES
    # =========================================================================

    - name: Install required base packages
      apt:
        name:
          - git
          - curl
          - ca-certificates
          - gnupg
          - lsb-release
          - python3-pip
        state: present
        update_cache: yes

    # =========================================================================
    # 2. DOCKER CE + COMPOSE PLUGIN
    # =========================================================================

    - name: Create Docker apt keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker official GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker official apt repository
      shell: |
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/ubuntu \
          $(lsb_release -cs) stable" \
          | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: yes

    - name: Remove conflicting old docker packages
      apt:
        name:
          - docker.io
          - docker-compose
          - containerd
        state: absent
      ignore_errors: yes

    - name: Install Docker CE + Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Wait for Docker daemon to be ready
      shell: |
        for i in $(seq 1 24); do
          if docker info > /dev/null 2>&1; then
            echo "Docker daemon is ready"
            exit 0
          fi
          echo "  Waiting for Docker... attempt $i/24"
          sleep 5
        done
        echo "Docker daemon never became ready"
        exit 1
      changed_when: false

    - name: Verify docker compose plugin works
      command: docker compose version
      changed_when: false
      register: compose_ver

    - name: Show Docker Compose version
      debug:
        msg: "{{ compose_ver.stdout }}"

    # =========================================================================
    # 3. SWAP
    # =========================================================================

    - name: Check if swapfile already exists
      stat:
        path: /swapfile
      register: swapfile_stat

    - name: Create 4GB swap file
      command: fallocate -l 4G /swapfile
      when: not swapfile_stat.stat.exists

    - name: Set swap file permissions
      file:
        path: /swapfile
        mode: '0600'
      when: not swapfile_stat.stat.exists

    - name: Format swap file
      command: mkswap /swapfile
      when: not swapfile_stat.stat.exists

    - name: Enable swap file
      command: swapon /swapfile
      when: not swapfile_stat.stat.exists

    # =========================================================================
    # 4. CLEAN SLATE
    # =========================================================================

    - name: Check if defectdojo directory exists from a previous run
      stat:
        path: "{{ defectdojo_dir }}"
      register: dojo_dir_stat

    - name: Tear down any existing DefectDojo containers and volumes
      command: docker compose down -v --remove-orphans
      args:
        chdir: "{{ defectdojo_dir }}"
      when: dojo_dir_stat.stat.exists
      ignore_errors: yes

    - name: Remove existing DefectDojo directory
      file:
        path: "{{ defectdojo_dir }}"
        state: absent
      when: dojo_dir_stat.stat.exists

    # =========================================================================
    # 5. CLONE
    # =========================================================================

    - name: Clone DefectDojo repository
      git:
        repo: https://github.com/DefectDojo/django-DefectDojo.git
        dest: "{{ defectdojo_dir }}"
        version: master
        force: yes
        depth: 1

    # =========================================================================
    # 6. WRITE .env FILE
    #
    #    ROOT CAUSE FIX: The initializer reads DD_ADMIN_PASSWORD from its
    #    container environment, which docker compose populates from the .env
    #    file in the project directory. We must write ALL required vars here.
    #
    #    From docker-compose.yml:
    #      DD_ADMIN_PASSWORD: "${DD_ADMIN_PASSWORD:-admin}"
    #    This means: read DD_ADMIN_PASSWORD from env, default to "admin".
    #    So we MUST have DD_ADMIN_PASSWORD in the .env file for it to work.
    # =========================================================================

    - name: Write .env file with all required variables
      copy:
        dest: "{{ defectdojo_dir }}/.env"
        content: |
          # Django version (required by docker-compose.yml image tag)
          DJANGO_VERSION=latest

          # ---- Admin credentials (read by initializer container) ----
          DD_ADMIN_USER=admin
          DD_ADMIN_PASSWORD={{ _dd_admin_password }}
          DD_ADMIN_MAIL=admin@defectdojo.local
          DD_ADMIN_FIRST_NAME=Admin
          DD_ADMIN_LAST_NAME=User

          # ---- Secret key ----
          DD_SECRET_KEY={{ _dd_secret_key }}

          # ---- Database ----
          # MUST match the postgres container's POSTGRES_PASSWORD (default: defectdojo)
          # Do NOT change one without changing the other
          DD_DATABASE_URL=postgresql://defectdojo:defectdojo@postgres:5432/defectdojo
          DD_DATABASE_HOST=postgres
          DD_DATABASE_PORT=5432
          DD_DATABASE_NAME=defectdojo
          DD_DATABASE_USER=defectdojo
          DD_DATABASE_PASSWORD=defectdojo

          # ---- Other settings ----
          DD_ALLOWED_HOSTS=*
          DD_DEBUG=False
          DD_TIME_ZONE=UTC
        mode: '0600'

    - name: Verify .env password line written correctly
      shell: grep "^DD_ADMIN_PASSWORD=" "{{ defectdojo_dir }}/.env" | cut -d= -f2-
      register: env_pw_check
      changed_when: false
      no_log: true

    - name: Assert .env password matches expected value
      assert:
        that:
          - env_pw_check.stdout == _dd_admin_password
        fail_msg: "MISMATCH: .env DD_ADMIN_PASSWORD does not match _dd_admin_password. Variable interpolation failed."
        success_msg: ".env password verified OK."

    # =========================================================================
    # 7. PULL IMAGES
    # =========================================================================

    - name: Pull all Docker images
      command: docker compose --env-file .env pull
      args:
        chdir: "{{ defectdojo_dir }}"
      register: pull_result
      retries: 3
      delay: 15
      until: pull_result.rc == 0

    # =========================================================================
    # 8. START POSTGRES + VALKEY ONLY
    # =========================================================================

    - name: Start postgres and valkey containers
      command: docker compose --env-file .env up -d postgres valkey
      args:
        chdir: "{{ defectdojo_dir }}"

    - name: Wait for postgres to be ready (up to 5 minutes)
      shell: |
        MAX=60
        i=0
        while [ $i -lt $MAX ]; do
          if docker exec defectdojo-postgres-1 \
              pg_isready -U defectdojo -d defectdojo > /dev/null 2>&1; then
            echo "OK: postgres is accepting connections"
            exit 0
          fi
          echo "  postgres not ready yet... attempt $((i+1))/$MAX"
          sleep 5
          i=$((i+1))
        done
        echo "FAIL: postgres never became ready"
        docker logs defectdojo-postgres-1 --tail 30 2>&1 || true
        exit 1
      args:
        chdir: "{{ defectdojo_dir }}"
      register: postgres_health
      failed_when: postgres_health.rc != 0

    - name: Show postgres health result
      debug:
        msg: "{{ postgres_health.stdout_lines }}"

    # =========================================================================
    # 9. RUN INITIALIZER — THE CRITICAL FIX
    #
    #    PREVIOUS BUG: `docker compose up -d initializer` launched it
    #    in background and our wait loop was watching for a container
    #    that was never named defectdojo-initializer-1 because it was
    #    never actually started (other services skipped it after seeing
    #    no prior run). The pipeline then timed out after 8m 54s.
    #
    #    FIX: Use `docker compose run --rm` which:
    #      1. Runs the initializer SYNCHRONOUSLY (blocks until complete)
    #      2. Loads env vars from our .env file (including DD_ADMIN_PASSWORD)
    #      3. Returns the actual exit code so we fail fast on errors
    #      4. --no-deps prevents restarting postgres/valkey
    #
    #    This runs: manage.py migrate + createsuperuser + loaddata
    #    Creates ALL tables: dojo_system_settings, dojo_test_type, etc.
    # =========================================================================

    - name: Run initializer synchronously — blocks until DB is fully initialized
      # ROOT CAUSE FIX:
      # `docker compose run` does NOT pass .env values as container env vars.
      # The .env file is only used for variable substitution in docker-compose.yml.
      # DD_ADMIN_PASSWORD must be explicitly injected with -e flag.
      shell: |
        docker compose --env-file .env run --rm --no-deps \
          -e DD_ADMIN_PASSWORD={{ _dd_admin_password | quote }} \
          -e DD_ADMIN_USER=admin \
          -e DD_ADMIN_MAIL=admin@defectdojo.local \
          -e DD_ADMIN_FIRST_NAME=Admin \
          -e DD_ADMIN_LAST_NAME=User \
          initializer
      args:
        chdir: "{{ defectdojo_dir }}"
      register: initializer_result
      async: 1200
      poll: 15

    - name: Show initializer output
      debug:
        msg: "{{ initializer_result.stdout_lines | default(['(no output captured - check docker logs']) }}"

    - name: Fail if initializer exited non-zero
      fail:
        msg: "Initializer failed with rc={{ initializer_result.rc }}. See output above."
      when: initializer_result.rc is defined and initializer_result.rc != 0

    - name: Verify dojo_system_settings table exists in postgres
      shell: |
        docker exec defectdojo-postgres-1 \
          psql -U defectdojo -d defectdojo -tAc \
          "SELECT COUNT(*) FROM information_schema.tables WHERE table_name='dojo_system_settings';"
      register: table_check
      failed_when: table_check.stdout.strip() != '1'

    - name: Show table verification
      debug:
        msg: "dojo_system_settings table confirmed present (count={{ table_check.stdout.strip() }})"

    # =========================================================================
    # 10. START ALL REMAINING SERVICES
    # =========================================================================

    - name: Start all remaining DefectDojo services
      command: docker compose --env-file .env up -d
      args:
        chdir: "{{ defectdojo_dir }}"

    # =========================================================================
    # 11. WAIT FOR WEB INTERFACE
    # =========================================================================

    - name: Wait for nginx to expose port 8080 (up to 10 minutes)
      wait_for:
        host: 127.0.0.1
        port: 8080
        timeout: 600
        delay: 15
        sleep: 10

    - name: Verify DefectDojo HTTP response
      uri:
        url: "http://127.0.0.1:8080/login?next=/"
        method: GET
        status_code:
          - 200
          - 302
        timeout: 30
      register: http_check
      retries: 10
      delay: 15
      until: http_check.status in [200, 302]

    # =========================================================================
    # 12. SMOKE TEST — verify login works with the configured password
    #
    #     DefectDojo API v2 does NOT support Basic Auth on /api/v2/user/.
    #     Correct flow:
    #       POST credentials to /api/v2/auth-token/ -> get token
    #       Use "Authorization: Token <token>" for subsequent calls
    # =========================================================================

    - name: Smoke-test — obtain API auth token with configured password
      uri:
        url: "http://127.0.0.1:8080/api/v2/auth-token/"
        method: POST
        body_format: json
        body:
          username: "admin"
          password: "{{ _dd_admin_password }}"
        status_code: 200
        timeout: 30
      register: token_result
      retries: 5
      delay: 10
      until: token_result.status == 200
      no_log: true

    - name: Confirm smoke test passed — token obtained successfully
      debug:
        msg: "Login verified — API token obtained. Password is correct."

    - name: Smoke-test — verify token works on /api/v2/user/
      uri:
        url: "http://127.0.0.1:8080/api/v2/user/"
        method: GET
        headers:
          Authorization: "Token {{ token_result.json.token }}"
        status_code: 200
        timeout: 30
      register: user_result
      no_log: true

    - name: Show logged-in user info
      debug:
        msg: "Logged in as: {{ user_result.json.results[0].username }} (id={{ user_result.json.results[0].id }})" 

    # =========================================================================
    # 13. FINAL STATUS
    # =========================================================================

    - name: Get final container status
      command: docker compose --env-file .env ps
      args:
        chdir: "{{ defectdojo_dir }}"
      register: compose_status
      changed_when: false

    - name: Display running containers
      debug:
        msg: "{{ compose_status.stdout_lines }}"

    - name: DefectDojo access information
      debug:
        msg:
          - "========================================"
          - "  DefectDojo is now running!"
          - "========================================"
          - "  URL:      http://{{ ansible_default_ipv4.address }}:8080"
          - "  Username: admin"
          - "  Password: (as configured in dd_admin_password secret)"
          - "========================================"
