---
- name: Install DefectDojo
  hosts: localhost
  connection: local
  become: true

  vars:
    # FIX 1: Do NOT self-reference the variable.
    # Use a distinct internal name to avoid the Ansible variable recursion trap.
    # These defaults are only used if the variable is NOT passed from CI/CD.
    # In your pipeline, pass: -e dd_admin_password="$SECRET_PASSWORD"
    _dd_admin_password: "{{ dd_admin_password | default('Admin1234!') }}"
    _dd_secret_key: "{{ dd_secret_key | default('hhZCp@D28z!n@NED*yB!ROMt+WzsY*Vy') }}"
    defectdojo_dir: /opt/defectdojo

  tasks:

    # =========================================================================
    # DEBUG: Print which password is actually in use (mask in prod if needed)
    # =========================================================================

    - name: Show which admin password will be used (first 3 chars only)
      debug:
        msg: "dd_admin_password starts with: {{ _dd_admin_password[:3] }}*** (length={{ _dd_admin_password | length }})"

    # =========================================================================
    # 1. BASE PACKAGES
    # =========================================================================

    - name: Install required base packages
      apt:
        name:
          - git
          - curl
          - ca-certificates
          - gnupg
          - lsb-release
          - python3-pip
        state: present
        update_cache: yes

    # =========================================================================
    # 2. DOCKER CE + COMPOSE PLUGIN
    # =========================================================================

    - name: Create Docker apt keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker official GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker official apt repository
      shell: |
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/ubuntu \
          $(lsb_release -cs) stable" \
          | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: yes

    - name: Remove conflicting old docker packages
      apt:
        name:
          - docker.io
          - docker-compose
          - containerd
        state: absent
      ignore_errors: yes

    - name: Install Docker CE + Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Wait for Docker daemon to be ready
      shell: |
        for i in $(seq 1 24); do
          if docker info > /dev/null 2>&1; then
            echo "Docker daemon is ready"
            exit 0
          fi
          echo "  Waiting for Docker... attempt $i/24"
          sleep 5
        done
        echo "Docker daemon never became ready"
        exit 1
      changed_when: false

    - name: Verify docker compose plugin works
      command: docker compose version
      changed_when: false
      register: compose_ver

    - name: Show Docker Compose version
      debug:
        msg: "{{ compose_ver.stdout }}"

    # =========================================================================
    # 3. SWAP
    # =========================================================================

    - name: Check if swapfile already exists
      stat:
        path: /swapfile
      register: swapfile_stat

    - name: Create 4GB swap file
      command: fallocate -l 4G /swapfile
      when: not swapfile_stat.stat.exists

    - name: Set swap file permissions
      file:
        path: /swapfile
        mode: '0600'
      when: not swapfile_stat.stat.exists

    - name: Format swap file
      command: mkswap /swapfile
      when: not swapfile_stat.stat.exists

    - name: Enable swap file
      command: swapon /swapfile
      when: not swapfile_stat.stat.exists

    - name: Show memory status
      command: free -h
      changed_when: false
      register: mem_status

    - name: Display memory
      debug:
        msg: "{{ mem_status.stdout_lines }}"

    # =========================================================================
    # 4. CLEAN SLATE
    # =========================================================================

    - name: Check if defectdojo directory exists from a previous run
      stat:
        path: "{{ defectdojo_dir }}"
      register: dojo_dir_stat

    - name: Tear down any existing DefectDojo containers and volumes
      command: docker compose down -v --remove-orphans
      args:
        chdir: "{{ defectdojo_dir }}"
      when: dojo_dir_stat.stat.exists
      ignore_errors: yes

    - name: Remove existing DefectDojo directory
      file:
        path: "{{ defectdojo_dir }}"
        state: absent
      when: dojo_dir_stat.stat.exists

    # =========================================================================
    # 5. CLONE
    # =========================================================================

    - name: Clone DefectDojo repository
      git:
        repo: https://github.com/DefectDojo/django-DefectDojo.git
        dest: "{{ defectdojo_dir }}"
        version: master
        force: yes
        depth: 1

    # =========================================================================
    # 6. WRITE .env FILE
    #
    #    FIX 2: Use _dd_admin_password (the safe internal variable).
    #    FIX 3: Also write DD_INITIALIZE_WITH_ADMIN_PASSWORD so the
    #           initializer container picks it up regardless of compose version.
    #
    #    Database password is intentionally left as the default "defectdojo"
    #    to match the postgres container's built-in default. Do NOT change
    #    one without changing the other.
    # =========================================================================

    - name: Write .env file
      copy:
        dest: "{{ defectdojo_dir }}/.env"
        content: |
          # ---- Admin credentials ----
          DD_ADMIN_USER=admin
          DD_ADMIN_PASSWORD={{ _dd_admin_password }}
          DD_ADMIN_MAIL=admin@defectdojo.local

          # FIX: Some DefectDojo versions read this key specifically for init
          DD_INITIALIZE_WITH_ADMIN_PASSWORD={{ _dd_admin_password }}

          # ---- Secret key ----
          DD_SECRET_KEY={{ _dd_secret_key }}

          # ---- Database (must match postgres container default) ----
          # postgres container initializes with POSTGRES_PASSWORD=defectdojo
          # Do NOT change the password segment here without also setting
          # POSTGRES_PASSWORD= in this file.
          DD_DATABASE_URL=postgresql://defectdojo:defectdojo@postgres:5432/defectdojo

          # ---- Other settings ----
          DD_ALLOWED_HOSTS=*
          DD_DEBUG=False
        mode: '0600'

    - name: Verify .env file was written with correct password
      # Checks that the password line exists and is not empty
      shell: grep "^DD_ADMIN_PASSWORD=" "{{ defectdojo_dir }}/.env" | cut -d= -f2-
      register: env_pw_check
      changed_when: false
      no_log: true   # Don't print the password to logs

    - name: Assert .env password matches expected value
      assert:
        that:
          - env_pw_check.stdout == _dd_admin_password
        fail_msg: >
          MISMATCH: The password written to .env does not match _dd_admin_password.
          This means the variable was not interpolated correctly.
        success_msg: ".env password verified successfully."

    # =========================================================================
    # 7. PULL IMAGES
    # =========================================================================

    - name: Pull all Docker images
      command: docker compose --env-file .env pull
      args:
        chdir: "{{ defectdojo_dir }}"
      register: pull_result
      retries: 3
      delay: 15
      until: pull_result.rc == 0

    # =========================================================================
    # 8. START POSTGRES + VALKEY FIRST
    # =========================================================================

    - name: Start postgres and valkey containers
      command: docker compose --env-file .env up -d postgres valkey
      args:
        chdir: "{{ defectdojo_dir }}"

    - name: Wait for postgres to be ready (up to 5 minutes)
      shell: |
        MAX=60
        i=0
        while [ $i -lt $MAX ]; do
          if docker exec defectdojo-postgres-1 \
              pg_isready -U defectdojo -d defectdojo > /dev/null 2>&1; then
            echo "OK: postgres is accepting connections"
            exit 0
          fi
          echo "  postgres not ready yet... attempt $((i+1))/$MAX"
          sleep 5
          i=$((i+1))
        done
        echo "FAIL: postgres never became ready"
        docker logs defectdojo-postgres-1 --tail 30 2>&1 || true
        exit 1
      args:
        chdir: "{{ defectdojo_dir }}"
      register: postgres_health
      failed_when: postgres_health.rc != 0

    - name: Show postgres health result
      debug:
        msg: "{{ postgres_health.stdout_lines }}"

    # =========================================================================
    # 9. RUN INITIALIZER
    #
    #    FIX 4: Pass the admin password as an explicit environment variable
    #    directly to the initializer container via `docker compose run`.
    #    This is the most reliable method — it bypasses any .env parsing
    #    inconsistencies in different DefectDojo/Compose versions.
    # =========================================================================

    - name: Start initializer container with explicit env vars
      # Using `up` with --no-deps so it doesn't restart already-running services.
      # The -e flags inject our passwords directly into the container process.
      shell: >
        docker compose --env-file .env
        run --rm
        -e DD_ADMIN_PASSWORD={{ _dd_admin_password | quote }}
        -e DD_ADMIN_USER=admin
        -e DD_ADMIN_MAIL=admin@defectdojo.local
        -e DD_INITIALIZE_WITH_ADMIN_PASSWORD={{ _dd_admin_password | quote }}
        initializer
      args:
        chdir: "{{ defectdojo_dir }}"
      register: initializer_result
      failed_when: initializer_result.rc != 0

    - name: Show initializer output
      debug:
        msg: "{{ initializer_result.stdout_lines }}"

    # =========================================================================
    # 10. FORCE-RESET ADMIN PASSWORD VIA DJANGO (belt-and-suspenders)
    #
    #     FIX 5: Even if the initializer set the wrong password, this step
    #     explicitly resets it using Django's changepassword / shell command.
    #     This runs AFTER the initializer so the user definitely exists.
    # =========================================================================

    - name: Force-set admin password via Django management command
      shell: |
        docker compose --env-file .env run --rm \
          -e DJANGO_SUPERUSER_PASSWORD={{ _dd_admin_password | quote }} \
          uwsgi \
          bash -c "python manage.py shell -c \"
        from django.contrib.auth import get_user_model
        User = get_user_model()
        u = User.objects.get(username='admin')
        u.set_password('{{ _dd_admin_password }}')
        u.save()
        print('Password reset OK for user:', u.username)
        \""
      args:
        chdir: "{{ defectdojo_dir }}"
      register: pw_reset
      failed_when: pw_reset.rc != 0

    - name: Show password reset result
      debug:
        msg: "{{ pw_reset.stdout_lines }}"

    # =========================================================================
    # 11. START ALL REMAINING SERVICES
    # =========================================================================

    - name: Start all remaining DefectDojo services
      command: docker compose --env-file .env up -d
      args:
        chdir: "{{ defectdojo_dir }}"

    # =========================================================================
    # 12. WAIT FOR WEB INTERFACE
    # =========================================================================

    - name: Wait for nginx to expose port 8080 (up to 10 minutes)
      wait_for:
        host: 127.0.0.1
        port: 8080
        timeout: 600
        delay: 15
        sleep: 10

    - name: Verify DefectDojo HTTP response
      uri:
        url: "http://127.0.0.1:8080/login?next=/"
        method: GET
        status_code:
          - 200
          - 302
        timeout: 30
      register: http_check
      retries: 10
      delay: 15
      until: http_check.status in [200, 302]

    # =========================================================================
    # 13. SMOKE TEST: Verify login actually works with the configured password
    # =========================================================================

    - name: Smoke-test login with configured admin password
      uri:
        url: "http://127.0.0.1:8080/api/v2/user/"
        method: GET
        user: admin
        password: "{{ _dd_admin_password }}"
        force_basic_auth: yes
        status_code: 200
        timeout: 30
      register: login_test
      retries: 5
      delay: 10
      until: login_test.status == 200
      no_log: true   # Don't expose credentials in logs

    - name: Confirm login smoke test passed
      debug:
        msg: "Login verified successfully via API."

    # =========================================================================
    # 14. FINAL STATUS
    # =========================================================================

    - name: Get final container status
      command: docker compose --env-file .env ps
      args:
        chdir: "{{ defectdojo_dir }}"
      register: compose_status
      changed_when: false

    - name: Display running containers
      debug:
        msg: "{{ compose_status.stdout_lines }}"

    - name: DefectDojo access information
      debug:
        msg:
          - "========================================"
          - "  DefectDojo is now running!"
          - "========================================"
          - "  URL:      http://{{ ansible_default_ipv4.address }}:8080"
          - "  Username: admin"
          - "  Password: (as configured in dd_admin_password secret)"
          - "========================================"
