---
- name: Install DefectDojo
  hosts: localhost
  connection: local
  become: true

  vars:
    db_password: "{{ db_password | default('defectdojo') }}"
    dd_admin_password: "{{ dd_admin_password | default('Admin1234!') }}"
    dd_secret_key: "{{ dd_secret_key | default('hhZCp@D28z!n@NED*yB!ROMt+WzsY*Vy') }}"
    defectdojo_dir: /opt/defectdojo
    # NEW: env file is now inside dojo/settings/ not at root
    env_template: "{{ defectdojo_dir }}/dojo/settings/template-env"
    env_dest: "{{ defectdojo_dir }}/dojo/settings/.env.prod"

  tasks:

    # =========================================================================
    # 1. BASE PACKAGES
    # =========================================================================

    - name: Install required base packages
      apt:
        name:
          - git
          - curl
          - ca-certificates
          - gnupg
          - lsb-release
          - python3-pip
        state: present
        update_cache: yes

    # =========================================================================
    # 2. DOCKER CE + COMPOSE PLUGIN (official Docker repo — NOT docker.io)
    # =========================================================================

    - name: Create Docker apt keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker official GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker official apt repository
      shell: |
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/ubuntu \
          $(lsb_release -cs) stable" \
          | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: yes

    - name: Remove conflicting old docker packages
      apt:
        name:
          - docker.io
          - docker-compose
          - containerd
        state: absent
      ignore_errors: yes

    - name: Install Docker CE + Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Wait for Docker daemon to be ready
      shell: |
        for i in $(seq 1 24); do
          if docker info > /dev/null 2>&1; then
            echo "Docker daemon is ready"
            exit 0
          fi
          echo "  Waiting for Docker... attempt $i/24"
          sleep 5
        done
        echo "Docker daemon never became ready"
        exit 1
      changed_when: false

    - name: Verify docker compose plugin works
      command: docker compose version
      changed_when: false
      register: compose_ver
      failed_when: compose_ver.rc != 0

    - name: Show Docker Compose version
      debug:
        msg: "{{ compose_ver.stdout }}"

    # =========================================================================
    # 3. SWAP — safety net in case RAM is tight under load
    # =========================================================================

    - name: Check if swapfile already exists
      stat:
        path: /swapfile
      register: swapfile_stat

    - name: Create 4GB swap file
      command: fallocate -l 4G /swapfile
      when: not swapfile_stat.stat.exists

    - name: Set swap file permissions
      file:
        path: /swapfile
        mode: '0600'
      when: not swapfile_stat.stat.exists

    - name: Format swap file
      command: mkswap /swapfile
      when: not swapfile_stat.stat.exists

    - name: Enable swap file
      command: swapon /swapfile
      when: not swapfile_stat.stat.exists

    - name: Show memory status
      command: free -h
      changed_when: false
      register: mem_status

    - name: Display memory
      debug:
        msg: "{{ mem_status.stdout_lines }}"

    # =========================================================================
    # 4. CLEAN SLATE — remove any previous broken attempt
    # =========================================================================

    - name: Check if defectdojo directory exists from a previous run
      stat:
        path: "{{ defectdojo_dir }}"
      register: dojo_dir_stat

    - name: Tear down any existing DefectDojo containers and volumes
      command: docker compose down -v --remove-orphans
      args:
        chdir: "{{ defectdojo_dir }}"
      when: dojo_dir_stat.stat.exists
      ignore_errors: yes

    - name: Remove existing DefectDojo directory
      file:
        path: "{{ defectdojo_dir }}"
        state: absent
      when: dojo_dir_stat.stat.exists

    # =========================================================================
    # 5. CLONE & CONFIGURE
    # =========================================================================

    - name: Clone DefectDojo repository
      git:
        repo: https://github.com/DefectDojo/django-DefectDojo.git
        dest: "{{ defectdojo_dir }}"
        version: master
        force: yes
        depth: 1

    - name: Show what env-related files exist after clone
      shell: |
        echo "=== Root level env files ==="
        ls -la {{ defectdojo_dir }}/.env* 2>/dev/null || echo "none at root"
        echo "=== dojo/settings env files ==="
        ls -la {{ defectdojo_dir }}/dojo/settings/.env* 2>/dev/null || echo "none in dojo/settings"
        echo "=== dojo/settings template files ==="
        ls -la {{ defectdojo_dir }}/dojo/settings/template* 2>/dev/null || echo "none"
      register: env_files_check
      changed_when: false

    - name: Display found env files
      debug:
        msg: "{{ env_files_check.stdout_lines }}"

    - name: Confirm env template exists at new location
      stat:
        path: "{{ env_template }}"
      register: env_template_stat
      failed_when: not env_template_stat.stat.exists

    - name: Copy env template to .env.prod
      copy:
        src: "{{ env_template }}"
        dest: "{{ env_dest }}"
        remote_src: yes

    - name: Configure all DefectDojo environment variables
      lineinfile:
        path: "{{ env_dest }}"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: yes
      loop:
        - { regexp: '^DD_DATABASE_PASSWORD=',  line: 'DD_DATABASE_PASSWORD={{ db_password }}' }
        - { regexp: '^DD_ADMIN_PASSWORD=',      line: 'DD_ADMIN_PASSWORD={{ dd_admin_password }}' }
        - { regexp: '^DD_SECRET_KEY=',          line: 'DD_SECRET_KEY={{ dd_secret_key }}' }
        - { regexp: '^DD_ALLOWED_HOSTS=',       line: 'DD_ALLOWED_HOSTS=*' }
        - { regexp: '^DD_DEBUG=',               line: 'DD_DEBUG=False' }
        - { regexp: '^DD_ADMIN_USER=',          line: 'DD_ADMIN_USER=admin' }
        - { regexp: '^DD_ADMIN_MAIL=',          line: 'DD_ADMIN_MAIL=admin@defectdojo.local' }
        - { regexp: '^DD_DATABASE_HOST=',       line: 'DD_DATABASE_HOST=postgres' }
        - { regexp: '^DD_DATABASE_PORT=',       line: 'DD_DATABASE_PORT=5432' }
        - { regexp: '^DD_DATABASE_NAME=',       line: 'DD_DATABASE_NAME=defectdojo' }
        - { regexp: '^DD_DATABASE_USER=',       line: 'DD_DATABASE_USER=defectdojo' }

    - name: Confirm .env.prod was written correctly
      shell: grep -c "DD_DATABASE_PASSWORD" "{{ env_dest }}"
      register: env_check
      changed_when: false
      failed_when: env_check.rc != 0

    # =========================================================================
    # 6. PULL IMAGES
    # =========================================================================

    - name: Pull all Docker images
      command: docker compose pull
      args:
        chdir: "{{ defectdojo_dir }}"
      environment:
        DD_DATABASE_PASSWORD: "{{ db_password }}"
        DD_ADMIN_PASSWORD: "{{ dd_admin_password }}"
        DD_SECRET_KEY: "{{ dd_secret_key }}"
      register: pull_result
      retries: 3
      delay: 15
      until: pull_result.rc == 0

    # =========================================================================
    # 7. START POSTGRES + VALKEY FIRST
    # =========================================================================

    - name: Start postgres and valkey containers
      command: docker compose up -d postgres valkey
      args:
        chdir: "{{ defectdojo_dir }}"
      environment:
        DD_DATABASE_PASSWORD: "{{ db_password }}"
        DD_ADMIN_PASSWORD: "{{ dd_admin_password }}"
        DD_SECRET_KEY: "{{ dd_secret_key }}"

    - name: Wait for postgres to accept connections (up to 5 minutes)
      shell: |
        MAX=60
        i=0
        while [ $i -lt $MAX ]; do
          if docker exec defectdojo-postgres-1 \
              pg_isready -U defectdojo -d defectdojo > /dev/null 2>&1; then
            echo "OK: postgres is accepting connections"
            exit 0
          fi
          echo "  postgres not ready yet... attempt $((i+1))/$MAX"
          sleep 5
          i=$((i+1))
        done
        echo "FAIL: postgres never became ready after 5 minutes"
        echo "=== POSTGRES LOGS ==="
        docker logs defectdojo-postgres-1 --tail 50 2>&1 || true
        exit 1
      args:
        chdir: "{{ defectdojo_dir }}"
      register: postgres_health
      failed_when: postgres_health.rc != 0

    - name: Show postgres health result
      debug:
        msg: "{{ postgres_health.stdout_lines }}"

    # =========================================================================
    # 8. RUN INITIALIZER
    # =========================================================================

    - name: Start initializer container
      command: docker compose up -d initializer
      args:
        chdir: "{{ defectdojo_dir }}"
      environment:
        DD_DATABASE_PASSWORD: "{{ db_password }}"
        DD_ADMIN_PASSWORD: "{{ dd_admin_password }}"
        DD_SECRET_KEY: "{{ dd_secret_key }}"

    - name: Wait for initializer to complete (up to 20 minutes)
      shell: |
        MAX=240
        i=0
        while [ $i -lt $MAX ]; do
          STATUS=$(docker inspect \
            --format='{{"{{"}}json .State.Status{{"}}"}}' \
            defectdojo-initializer-1 2>/dev/null | tr -d '"' || echo "missing")
          EXIT=$(docker inspect \
            --format='{{"{{"}}json .State.ExitCode{{"}}"}}' \
            defectdojo-initializer-1 2>/dev/null | tr -d '"' || echo "unknown")
          echo "  initializer: $STATUS  exit=$EXIT  (attempt $((i+1))/$MAX)"
          if [ "$STATUS" = "exited" ]; then
            if [ "$EXIT" = "0" ]; then
              echo "OK: initializer completed successfully"
              exit 0
            else
              echo "FAIL: initializer exited with code $EXIT"
              echo "=== FULL INITIALIZER LOGS ==="
              docker logs defectdojo-initializer-1 2>&1
              echo "=== END INITIALIZER LOGS ==="
              exit 1
            fi
          fi
          sleep 5
          i=$((i+1))
        done
        echo "FAIL: initializer timed out after 20 minutes"
        echo "=== INITIALIZER LOGS (last 150 lines) ==="
        docker logs defectdojo-initializer-1 2>&1 | tail -150
        exit 1
      args:
        chdir: "{{ defectdojo_dir }}"
      register: initializer_wait
      failed_when: initializer_wait.rc != 0

    - name: Show initializer result
      debug:
        msg: "{{ initializer_wait.stdout_lines }}"

    # =========================================================================
    # 9. START ALL REMAINING SERVICES
    # =========================================================================

    - name: Start all remaining DefectDojo services
      command: docker compose up -d
      args:
        chdir: "{{ defectdojo_dir }}"
      environment:
        DD_DATABASE_PASSWORD: "{{ db_password }}"
        DD_ADMIN_PASSWORD: "{{ dd_admin_password }}"
        DD_SECRET_KEY: "{{ dd_secret_key }}"

    # =========================================================================
    # 10. WAIT FOR WEB INTERFACE
    # =========================================================================

    - name: Wait for nginx to expose port 8080 (up to 10 minutes)
      wait_for:
        host: 127.0.0.1
        port: 8080
        timeout: 600
        delay: 15
        sleep: 10

    - name: Verify DefectDojo HTTP response
      uri:
        url: "http://127.0.0.1:8080/login?next=/"
        method: GET
        status_code:
          - 200
          - 302
        timeout: 30
      register: http_check
      retries: 10
      delay: 15
      until: http_check.status in [200, 302]

    # =========================================================================
    # 11. FINAL STATUS REPORT
    # =========================================================================

    - name: Get final container status
      command: docker compose ps
      args:
        chdir: "{{ defectdojo_dir }}"
      register: compose_status
      changed_when: false

    - name: Display running containers
      debug:
        msg: "{{ compose_status.stdout_lines }}"

    - name: DefectDojo access information
      debug:
        msg:
          - "========================================"
          - "  DefectDojo is now running!"
          - "========================================"
          - "  URL:      http://{{ ansible_default_ipv4.address }}:8080"
          - "  Username: admin"
          - "  Password: {{ dd_admin_password }}"
          - "========================================"