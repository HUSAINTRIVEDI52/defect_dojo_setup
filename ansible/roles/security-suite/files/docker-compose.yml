services:

  # --- Shared Database ---
  database:
    image: postgres:15-alpine
    container_name: defectdojo-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-defectdojopassword}
      POSTGRES_DB: defectdojo
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - dojo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis (Celery Broker) ---
  redis:
    image: redis:7-alpine
    container_name: dojo-redis
    networks:
      - dojo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Initializer (runs once: migrations + admin user) ---
  initializer:
    image: defectdojo/defectdojo-django:latest
    container_name: dojo-initializer
    command: /wait-for-it.sh database:5432 -t 30 -- bash -c "
      python manage.py migrate &&
      python manage.py createsuperuser --noinput || true &&
      python manage.py collectstatic --noinput"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DD_DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-defectdojopassword}@database:5432/defectdojo"
      DD_ALLOWED_HOSTS: "*"
      DD_SECRET_KEY: "${DD_SECRET_KEY:-verySecretKey1234567890abcdefghijklmnop}"
      DJANGO_SUPERUSER_USERNAME: "admin"
      DJANGO_SUPERUSER_PASSWORD: "${DD_ADMIN_PASSWORD:-defectdojo}"
      DJANGO_SUPERUSER_EMAIL: "admin@defectdojo.local"
    volumes:
      - dojo_media:/app/media
      - dojo_static:/app/static
    networks:
      - dojo-network

  # --- uWSGI (Main Web App on port 8080) ---
  uwsgi:
    image: defectdojo/defectdojo-django:latest
    container_name: dojo-uwsgi
    command: /wait-for-it.sh database:5432 -t 30 -- uwsgi --http 0.0.0.0:8080 --wsgi dojo.wsgi:application --workers 2 --threads 2 --static-map /static=/app/static
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DD_DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-defectdojopassword}@database:5432/defectdojo"
      DD_CELERY_BROKER_URL: "redis://redis:6379/0"
      DD_REDIS_URL: "redis://redis:6379/0"
      DD_ALLOWED_HOSTS: "*"
      DD_SECRET_KEY: "${DD_SECRET_KEY:-verySecretKey1234567890abcdefghijklmnop}"
      DD_SESSION_COOKIE_SECURE: "False"
      DD_CSRF_COOKIE_SECURE: "False"
    ports:
      - "8080:8080"
    volumes:
      - dojo_media:/app/media
      - dojo_static:/app/static
    networks:
      - dojo-network
    restart: unless-stopped

  # --- Celery Worker ---
  celery_worker:
    image: defectdojo/defectdojo-django:latest
    container_name: dojo-celery-worker
    command: /wait-for-it.sh database:5432 -t 30 -- celery --app=dojo.celery:app worker --loglevel=info --concurrency 2
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DD_DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-defectdojopassword}@database:5432/defectdojo"
      DD_CELERY_BROKER_URL: "redis://redis:6379/0"
      DD_REDIS_URL: "redis://redis:6379/0"
      DD_ALLOWED_HOSTS: "*"
      DD_SECRET_KEY: "${DD_SECRET_KEY:-verySecretKey1234567890abcdefghijklmnop}"
    networks:
      - dojo-network
    restart: unless-stopped

  # --- Celery Beat ---
  celery_beat:
    image: defectdojo/defectdojo-django:latest
    container_name: dojo-celery-beat
    command: /wait-for-it.sh database:5432 -t 30 -- celery --app=dojo.celery:app beat --loglevel=info
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DD_DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-defectdojopassword}@database:5432/defectdojo"
      DD_CELERY_BROKER_URL: "redis://redis:6379/0"
      DD_REDIS_URL: "redis://redis:6379/0"
      DD_ALLOWED_HOSTS: "*"
      DD_SECRET_KEY: "${DD_SECRET_KEY:-verySecretKey1234567890abcdefghijklmnop}"
    networks:
      - dojo-network
    restart: unless-stopped

networks:
  dojo-network:
    name: defectdojo-net
    driver: bridge

volumes:
  db_data:
  dojo_media:
  dojo_static:
