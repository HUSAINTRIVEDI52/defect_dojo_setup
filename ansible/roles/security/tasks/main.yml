---
# --- Swap Setup (DefectDojo + Celery need headroom on 8GB RAM) ---

- name: Ensure swapfile exists (8G)
  command: fallocate -l 8G /swapfile
  args:
    creates: /swapfile

- name: Set swapfile permissions
  file:
    path: /swapfile
    mode: '0600'
    owner: root
    group: root

- name: Format swapfile
  command: mkswap /swapfile
  register: mkswap_result
  changed_when: "'Setting up swapspace' in mkswap_result.stdout"
  failed_when: mkswap_result.rc != 0 and ('is mounted' not in mkswap_result.stderr)

- name: Enable swapfile
  command: swapon /swapfile
  register: swapon_result
  changed_when: swapon_result.rc == 0
  failed_when: swapon_result.rc != 0 and ('Device or resource busy' not in swapon_result.stderr)

- name: Persist swapfile across reboots
  mount:
    name: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Tune vm.swappiness
  sysctl:
    name: vm.swappiness
    value: '10'
    state: present

- name: Tune vm.vfs_cache_pressure
  sysctl:
    name: vm.vfs_cache_pressure
    value: '50'
    state: present

- name: Open port 8080 in UFW (if active)
  ufw:
    rule: allow
    port: '8080'
    proto: tcp
  ignore_errors: yes